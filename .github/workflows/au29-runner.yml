name: AU29 Remote Code Runner v6 - Swing-safe argv + multi-frame GUI capture + java2d fix

on:
  workflow_dispatch:
    inputs:
      language:
        description: Language (python/java/c/cpp)
        required: true
        type: string
      source:
        description: Source code
        required: true
        type: string
      stdin:
        description: Program standard input
        required: false
        type: string
      request_id:
        description: Unique request id
        required: true
        type: string
      gui_capture:
        description: "true to run under a virtual display and capture a screenshot (for GUI programs)"
        required: false
        type: string

permissions: {}

jobs:
  run-code:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Execute submitted code
        shell: bash
        env:
          LANGUAGE: ${{ inputs.language }}
          SOURCE: ${{ inputs.source }}
          STDIN_DATA: ${{ inputs.stdin }}
          REQUEST_ID: ${{ inputs.request_id }}
          GUI_CAPTURE: ${{ inputs.gui_capture }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/au29"
          printf '%s' "$SOURCE" > "$RUNNER_TEMP/au29/source.txt"
          printf '%s' "$STDIN_DATA" > "$RUNNER_TEMP/au29/input.txt"
          : > "$RUNNER_TEMP/au29/stdout.txt"
          : > "$RUNNER_TEMP/au29/stderr.txt"
          : > "$RUNNER_TEMP/au29/compile.txt"

          LANG_LOWER="$(printf '%s' "$LANGUAGE" | tr '[:upper:]' '[:lower:]')"
          RC=0
          RUN_CMD=()
          if [ "$LANG_LOWER" = "python" ] || [ "$LANG_LOWER" = "py" ]; then
            cp "$RUNNER_TEMP/au29/source.txt" "$RUNNER_TEMP/au29/main.py"
            RUN_CMD=(python3 "$RUNNER_TEMP/au29/main.py")
          elif [ "$LANG_LOWER" = "java" ]; then
            cp "$RUNNER_TEMP/au29/source.txt" "$RUNNER_TEMP/au29/source.java"
            CLASS_NAME="$(grep -Eo '(^|[[:space:]])(public[[:space:]]+)?(final[[:space:]]+|abstract[[:space:]]+)?class[[:space:]]+[A-Za-z_$][A-Za-z0-9_$]*' "$RUNNER_TEMP/au29/source.java" | sed -E 's/.*class[[:space:]]+//' | head -1)"
            [ -n "$CLASS_NAME" ] || CLASS_NAME="Main"
            if grep -Eq '^[[:space:]]*package[[:space:]]+' "$RUNNER_TEMP/au29/source.java"; then
              echo 'Java package declarations are not supported by the remote runner.' > "$RUNNER_TEMP/au29/compile.txt"
              RC=1
            else
              mv "$RUNNER_TEMP/au29/source.java" "$RUNNER_TEMP/au29/${CLASS_NAME}.java"
              javac "$RUNNER_TEMP/au29/${CLASS_NAME}.java" > "$RUNNER_TEMP/au29/compile.txt" 2>&1
              RC=$?
              if [ $RC -eq 0 ]; then
                RUN_CMD=(java -cp "$RUNNER_TEMP/au29" "$CLASS_NAME")
              fi
            fi
          elif [ "$LANG_LOWER" = "c" ]; then
            cp "$RUNNER_TEMP/au29/source.txt" "$RUNNER_TEMP/au29/main.c"
            gcc "$RUNNER_TEMP/au29/main.c" -O2 -std=c11 -o "$RUNNER_TEMP/au29/main" > "$RUNNER_TEMP/au29/compile.txt" 2>&1
            RC=$?
            if [ $RC -eq 0 ]; then
              RUN_CMD=("$RUNNER_TEMP/au29/main")
            fi
          elif [ "$LANG_LOWER" = "cpp" ] || [ "$LANG_LOWER" = "c++" ] || [ "$LANG_LOWER" = "cxx" ]; then
            cp "$RUNNER_TEMP/au29/source.txt" "$RUNNER_TEMP/au29/main.cpp"
            g++ "$RUNNER_TEMP/au29/main.cpp" -O2 -std=c++17 -o "$RUNNER_TEMP/au29/main" > "$RUNNER_TEMP/au29/compile.txt" 2>&1
            RC=$?
            if [ $RC -eq 0 ]; then
              RUN_CMD=("$RUNNER_TEMP/au29/main")
            fi
          else
            echo "Unsupported language: $LANGUAGE" > "$RUNNER_TEMP/au29/stderr.txt"
            RC=1
          fi

          if [ "${#RUN_CMD[@]}" -gt 0 ]; then
            # Detect Java GUI programs here too, so even an older/direct
            # workflow dispatch cannot accidentally use the console timeout.
            if [ "$LANG_LOWER" = "java" ] && grep -Eq               'javax[.]swing|java[.]awt|javafx|new[[:space:]]+JFrame|extends[[:space:]]+(JFrame|JDialog|JWindow|Frame|Application)'               "$RUNNER_TEMP/au29/source.txt"; then
              GUI_CAPTURE="true"
            fi

            if [ "$GUI_CAPTURE" = "true" ]; then
              # GitHub-hosted runners are headless. Xvfb supplies a virtual
              # display so Swing can create and paint its window.
              #
              # Java's default rendering pipeline on Linux uses XRender and
              # X pixmaps for offscreen/double-buffered drawing. Under Xvfb
              # this very commonly produces a solid-black (or garbled)
              # window to any *external* screen-grab tool, even though the
              # app itself is drawing fine internally - a long-standing
              # OpenJDK issue (see JDK-7172456), not a bug in the submitted
              # program. Forcing both flags off makes Java fall back to
              # plain software rendering straight into the window, which
              # Xvfb + `import` can actually see.
              if [ "$LANG_LOWER" = "java" ]; then
                RUN_CMD=(java -Dsun.java2d.xrender=false -Dsun.java2d.pmoffscreen=false -cp "$RUNNER_TEMP/au29" "$CLASS_NAME")
              fi
              DIAG="$RUNNER_TEMP/au29/gui_diag.txt"
              : > "$DIAG"
              if ! command -v Xvfb >/dev/null 2>&1 || ! command -v import >/dev/null 2>&1; then
                echo "installing xvfb/imagemagick..." >> "$DIAG"
                sudo apt-get update -qq >> "$DIAG" 2>&1
                sudo apt-get install -y -qq xvfb imagemagick >> "$DIAG" 2>&1
              fi
              command -v Xvfb >/dev/null 2>&1 && echo "Xvfb binary: found" >> "$DIAG" || echo "Xvfb binary: MISSING after install attempt" >> "$DIAG"
              command -v import >/dev/null 2>&1 && echo "import (ImageMagick) binary: found" >> "$DIAG" || echo "import (ImageMagick) binary: MISSING after install attempt" >> "$DIAG"

              export DISPLAY=:99
              Xvfb :99 -screen 0 1280x800x24 >> "$DIAG" 2>&1 &
              XVFB_PID=$!
              sleep 1
              if kill -0 "$XVFB_PID" >/dev/null 2>&1; then
                echo "Xvfb: running (pid $XVFB_PID) on display :99" >> "$DIAG"
              else
                echo "Xvfb: FAILED TO START (process exited immediately) - see output above" >> "$DIAG"
              fi

              # Execute argv elements directly. For Java this means
              # java, -cp, classpath and Main are separate arguments.
              "${RUN_CMD[@]}" < "$RUNNER_TEMP/au29/input.txt" > "$RUNNER_TEMP/au29/stdout.txt" 2> "$RUNNER_TEMP/au29/stderr.txt" &
              APP_PID=$!

              # A single screenshot can only ever show one instant, which is
              # useless for anything animated (a Timer redrawing, a counter
              # ticking, text being typed). Grab a short burst of frames
              # instead - one per second for 6 seconds - so the PC-side app
              # can flip through them like a flipbook. This still can't be
              # clicked on (there's no live connection to the sandbox), but
              # it shows *change over time* instead of one frozen frame.
              # `import`'s own stderr is captured into DIAG instead of being
              # thrown away, and each attempt is logged (path, exit code,
              # byte size), so a run that still produces no frames tells you
              # exactly which step failed instead of just "(no output)".
              if ! kill -0 "$APP_PID" >/dev/null 2>&1; then
                echo "Java process: exited immediately after launch (before any frame was captured) - check stderr above/below for the real crash reason" >> "$DIAG"
              fi
              for i in 1 2 3 4 5 6; do
                sleep 1
                f="$RUNNER_TEMP/au29/screenshot_${i}.png"
                if import -window root -resize 900x -silent "$f" >> "$DIAG" 2>&1; then
                  sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo "?")
                  echo "frame $i: captured ($sz bytes)" >> "$DIAG"
                else
                  echo "frame $i: import command FAILED (exit $?), no screenshot written" >> "$DIAG"
                fi
              done

              # GUI programs such as animations normally stay alive. Stop
              # them after the last frame rather than waiting 60 seconds.
              if kill -0 "$APP_PID" >/dev/null 2>&1; then
                kill "$APP_PID" >/dev/null 2>&1 || true
                sleep 1
                kill -9 "$APP_PID" >/dev/null 2>&1 || true
              fi
              wait "$APP_PID" >/dev/null 2>&1 || true
              RC=0
              kill "$XVFB_PID" >/dev/null 2>&1 || true
            else
              timeout 60s "${RUN_CMD[@]}" < "$RUNNER_TEMP/au29/input.txt" > "$RUNNER_TEMP/au29/stdout.txt" 2> "$RUNNER_TEMP/au29/stderr.txt"
              RC=$?
            fi
          fi

          export AU29_RC="$RC"
          export AU29_REQUEST_ID="$REQUEST_ID"
          b64() { base64 "$1" | tr -d '\n'; }
          echo '__AU29_RESULT_BEGIN__'
          echo "REQUEST_ID=$REQUEST_ID"
          echo "EXIT_CODE=$RC"
          echo "STDOUT_B64=$(b64 "$RUNNER_TEMP/au29/stdout.txt")"
          echo "STDERR_B64=$(b64 "$RUNNER_TEMP/au29/stderr.txt")"
          echo "COMPILE_B64=$(b64 "$RUNNER_TEMP/au29/compile.txt")"
          if [ -f "$RUNNER_TEMP/au29/gui_diag.txt" ]; then
            echo "GUI_DIAG_B64=$(b64 "$RUNNER_TEMP/au29/gui_diag.txt")"
          fi
          for i in 1 2 3 4 5 6; do
            f="$RUNNER_TEMP/au29/screenshot_${i}.png"
            if [ -f "$f" ]; then
              echo "SCREENSHOT_B64_${i}=$(b64 "$f")"
            fi
          done
          echo '__AU29_RESULT_END__'

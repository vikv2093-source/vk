# Android Emulator Lab workflow v3 — default APK fallback enabled
name: Android APK emulator test

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'HTTPS direct-download URL for the APK (or use APK_PATH below)'
        required: false
        default: 'https://www.csknight.com/ftp/app/5-40-PRO.apk'
        type: string
      apk_path:
        description: 'APK path already committed to the repository, e.g. test-app.apk'
        required: false
        default: ''
        type: string
      package_name:
        description: 'Optional package name. Leave blank to detect it from the APK.'
        required: false
        default: ''
        type: string

jobs:
  run-apk-on-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Obtain APK
        shell: bash
        env:
          APK_URL: ${{ inputs.apk_url }}
          APK_PATH: ${{ inputs.apk_path }}
        run: |
          set -euo pipefail
          if [[ -n "$APK_URL" ]]; then
            curl --fail --location --retry 3 --output app-under-test.apk "$APK_URL"
          elif [[ -n "$APK_PATH" ]]; then
            cp -- "$APK_PATH" app-under-test.apk
          else
            DEFAULT_APK_URL='https://www.csknight.com/ftp/app/5-40-PRO.apk'
            echo "No workflow input supplied; using default APK: $DEFAULT_APK_URL"
            curl --fail --location --retry 3 --output app-under-test.apk "$DEFAULT_APK_URL"
          fi
          test -s app-under-test.apk
          sha256sum app-under-test.apk

      - name: Detect APK package
        id: apk
        shell: bash
        env:
          INPUT_PACKAGE: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_PACKAGE" ]]; then
            package="$INPUT_PACKAGE"
          else
            echo "ANDROID_HOME=$ANDROID_HOME"
            test -x "$ANDROID_HOME/platform-tools/adb"
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -perm -u+x | sort | tail -n 1)"
            test -n "$AAPT"
            echo "Using AAPT=$AAPT"
            package="$($AAPT dump badging app-under-test.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          fi
          test -n "$package"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "Detected package: $package"

      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          sudo modprobe kvm || true
          sudo modprobe kvm_intel || sudo modprobe kvm_amd || true
          sudo groupadd -f kvm
          sudo usermod -aG kvm "$USER" || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          sudo chown "$USER":kvm /dev/kvm || true
          sudo chmod 666 /dev/kvm
          sudo setfacl -m "u:$USER:rw" /dev/kvm || true
          id
          ls -l /dev/kvm

      - name: Start Android emulator, install APK, and collect diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data -no-metrics
          disable-animations: true
          script: |
            set -euxo pipefail
            ADB="$ANDROID_HOME/platform-tools/adb"
            test -x "$ADB"
            "$ADB" version
            "$ADB" wait-for-device
            "$ADB" shell getprop sys.boot_completed
            "$ADB" install -r -d app-under-test.apk
            "$ADB" shell monkey -p "${{ steps.apk.outputs.package }}" 1
            sleep 12
            mkdir -p test-results
            "$ADB" exec-out screencap -p > test-results/screen.png
            "$ADB" logcat -d -t 1200 > test-results/logcat.txt
            "$ADB" shell dumpsys package "${{ steps.apk.outputs.package }}" > test-results/package.txt || true
            "$ADB" shell dumpsys gfxinfo "${{ steps.apk.outputs.package }}" > test-results/gfxinfo.txt || true

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-results
          path: |
            app-under-test.apk
            test-results/
          if-no-files-found: warn
          retention-days: 7
